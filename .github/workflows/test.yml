name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
        timeout-minutes: 2

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
        timeout-minutes: 3

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
        timeout-minutes: 3

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
        timeout-minutes: 5

      - name: Check FFmpeg
        run: ffmpeg -version
        timeout-minutes: 1

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev -e .
        timeout-minutes: 5

      - name: Run Python checks
        run: |
          python -m ruff format --check .
          python -m ruff check .
          python -m mypy sync
          python -m pytest -q
        timeout-minutes: 10

      - name: Generate and validate offline archive fixture
        run: |
          python tests/fixtures/build_sample_archive.py --output .tmp/sample-archive
          python -m sync.cli validate-snapshot --snapshot .tmp/sample-archive
          python -m sync.cli prepare-site-input --snapshot .tmp/sample-archive --destination site/public/archive
        timeout-minutes: 5

      - name: Install site dependencies
        working-directory: site
        run: npm ci
        timeout-minutes: 5

      - name: Check site
        working-directory: site
        run: npm run check
        timeout-minutes: 5

      - name: Test site
        working-directory: site
        run: npm test
        timeout-minutes: 5

      - name: Build site
        working-directory: site
        run: npm run build
        timeout-minutes: 5

      - name: Check static output
        working-directory: site
        run: npm run check:static
        timeout-minutes: 5

      - name: Install Playwright Chromium
        working-directory: site
        run: npx playwright install chromium
        timeout-minutes: 10

      - name: Run browser tests
        working-directory: site
        run: npm run test:e2e
        timeout-minutes: 10

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            site/test-results
            site/playwright-report
          if-no-files-found: ignore
          retention-days: 3
        timeout-minutes: 2
